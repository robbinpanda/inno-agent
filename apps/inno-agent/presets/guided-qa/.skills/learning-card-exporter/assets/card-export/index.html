<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>学习卡片导出工作台</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    />
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    ></script>
    <style id="page-size-style">
      @media print {
        @page {
          size: A4 portrait;
          margin: 11mm;
        }
      }
    </style>
    <style>
      :root {
        --ink: #183237;
        --muted: #687b7d;
        --line: #d9e5e2;
        --paper: #fffdf8;
        --canvas: #edf4f1;
        --teal: #157c78;
        --teal-dark: #0d5e5b;
        --teal-soft: #e4f4f0;
        --gold: #bb7b28;
        --gold-soft: #fff2d8;
        --shadow: 0 18px 50px rgba(35, 76, 72, 0.12);
        font-family:
          "Microsoft YaHei",
          "PingFang SC",
          "Noto Sans CJK SC",
          system-ui,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--canvas);
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 4%, rgba(255, 255, 255, 0.94), transparent 30rem),
          linear-gradient(145deg, #edf5f1 0%, #f7f2e8 100%);
      }

      button,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .screen-shell {
        width: min(1440px, calc(100% - 40px));
        margin: 0 auto;
        padding: 38px 0 52px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 32px;
        align-items: end;
        margin-bottom: 24px;
        padding: 30px 34px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.82);
        border-radius: 28px;
        background:
          linear-gradient(112deg, rgba(255, 255, 255, 0.96), rgba(248, 252, 248, 0.88)),
          var(--paper);
        box-shadow: var(--shadow);
        position: relative;
      }

      .hero::after {
        content: "";
        position: absolute;
        right: -50px;
        top: -92px;
        width: 260px;
        height: 260px;
        border: 36px solid rgba(21, 124, 120, 0.08);
        border-radius: 50%;
        pointer-events: none;
      }

      .eyebrow {
        display: flex;
        gap: 9px;
        align-items: center;
        margin: 0 0 10px;
        color: var(--teal);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
      }

      .eyebrow::before {
        content: "";
        width: 28px;
        height: 3px;
        border-radius: 99px;
        background: var(--teal);
      }

      h1 {
        margin: 0;
        font-family: "STSong", "Songti SC", "Noto Serif CJK SC", serif;
        font-size: clamp(30px, 4vw, 50px);
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      .hero-copy {
        max-width: 710px;
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.8;
      }

      .hero-stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(84px, 1fr));
        gap: 10px;
        position: relative;
        z-index: 1;
      }

      .stat {
        min-width: 92px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.86);
      }

      .stat strong {
        display: block;
        margin-bottom: 3px;
        color: var(--teal-dark);
        font-size: 24px;
        line-height: 1;
      }

      .stat span {
        color: var(--muted);
        font-size: 11px;
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(320px, 0.78fr);
        gap: 22px;
        align-items: start;
      }

      .panel {
        border: 1px solid rgba(255, 255, 255, 0.86);
        border-radius: 24px;
        background: rgba(255, 253, 248, 0.94);
        box-shadow: 0 14px 38px rgba(34, 69, 66, 0.09);
      }

      .library-panel {
        min-width: 0;
        padding: 22px;
      }

      .panel-heading {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      .panel-heading h2,
      .settings-panel h2 {
        margin: 0 0 5px;
        font-size: 19px;
      }

      .panel-heading p,
      .settings-panel > p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .selection-count {
        flex: 0 0 auto;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--teal-soft);
        color: var(--teal-dark);
        font-size: 12px;
        font-weight: 700;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) auto;
        gap: 12px;
        margin-bottom: 12px;
      }

      .search {
        position: relative;
      }

      .search::before {
        content: "⌕";
        position: absolute;
        left: 14px;
        top: 50%;
        color: var(--muted);
        font-size: 21px;
        transform: translateY(-52%) rotate(-15deg);
      }

      .search input {
        width: 100%;
        height: 44px;
        padding: 0 14px 0 41px;
        border: 1px solid var(--line);
        border-radius: 13px;
        outline: none;
        background: #fff;
        color: var(--ink);
        transition:
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .search input:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 4px rgba(21, 124, 120, 0.12);
      }

      .filter-row,
      .batch-actions {
        display: flex;
        gap: 7px;
        align-items: center;
        flex-wrap: wrap;
      }

      .filters-and-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .chip,
      .text-button,
      .order-button {
        border: 1px solid var(--line);
        background: #fff;
        cursor: pointer;
        transition:
          transform 150ms ease,
          border-color 150ms ease,
          background 150ms ease;
      }

      .chip {
        padding: 7px 11px;
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .chip.active {
        border-color: var(--teal);
        background: var(--teal);
        color: #fff;
      }

      .text-button {
        padding: 7px 10px;
        border-radius: 10px;
        color: var(--teal-dark);
        font-size: 12px;
        font-weight: 700;
      }

      .chip:hover,
      .text-button:hover,
      .order-button:hover {
        transform: translateY(-1px);
        border-color: var(--teal);
      }

      .card-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .selector-card {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: #fff;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .selector-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px rgba(34, 69, 66, 0.09);
      }

      .selector-card.selected {
        border-color: var(--teal);
        box-shadow: inset 0 0 0 1px var(--teal);
      }

      .selector-card.problem.selected {
        border-color: var(--gold);
        box-shadow: inset 0 0 0 1px var(--gold);
      }

      .selector-label {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 11px;
        min-height: 132px;
        padding: 15px;
        cursor: pointer;
      }

      .selector-label input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }

      .checkmark {
        display: grid;
        place-items: center;
        width: 27px;
        height: 27px;
        border: 1px solid #c7d7d4;
        border-radius: 9px;
        color: #fff;
        font-size: 11px;
        font-weight: 800;
      }

      .selected .checkmark {
        border-color: var(--teal);
        background: var(--teal);
      }

      .problem.selected .checkmark {
        border-color: var(--gold);
        background: var(--gold);
      }

      .selector-main {
        min-width: 0;
      }

      .selector-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }

      .type-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--teal);
        font-size: 11px;
        font-weight: 800;
      }

      .problem .type-badge {
        color: #9a621d;
      }

      .type-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }

      .card-date {
        color: #8a9899;
        font-size: 10px;
      }

      .selector-title {
        display: -webkit-box;
        overflow: hidden;
        margin: 0;
        color: #1b3439;
        font-size: 15px;
        line-height: 1.55;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .selector-preview {
        display: -webkit-box;
        overflow: hidden;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.65;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .order-tools {
        display: flex;
        justify-content: flex-end;
        gap: 6px;
        padding: 0 14px 12px;
      }

      .order-button {
        width: 27px;
        height: 25px;
        padding: 0;
        border-radius: 8px;
        color: var(--teal-dark);
        font-size: 12px;
        font-weight: 800;
      }

      .order-button:disabled {
        opacity: 0.35;
        cursor: default;
        transform: none;
      }

      .empty-state {
        grid-column: 1 / -1;
        padding: 56px 20px;
        border: 1px dashed #c7d6d2;
        border-radius: 18px;
        text-align: center;
        background: rgba(255, 255, 255, 0.52);
      }

      .empty-mark {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        margin: 0 auto 13px;
        border-radius: 17px;
        background: var(--teal-soft);
        color: var(--teal);
        font-family: serif;
        font-size: 30px;
        font-weight: 700;
      }

      .empty-state h3 {
        margin: 0 0 7px;
        font-size: 16px;
      }

      .empty-state p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.7;
      }

      .settings-panel {
        position: sticky;
        top: 20px;
        padding: 22px;
      }

      .settings-group {
        margin-top: 22px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }

      .settings-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 11px;
        font-size: 12px;
        font-weight: 800;
      }

      .settings-label span {
        color: var(--muted);
        font-size: 10px;
        font-weight: 500;
      }

      .layout-options {
        display: grid;
        gap: 9px;
      }

      .layout-option {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr) 22px;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        cursor: pointer;
      }

      .layout-option:has(input:checked) {
        border-color: var(--teal);
        box-shadow: inset 0 0 0 1px var(--teal);
      }

      .layout-option input {
        position: absolute;
        opacity: 0;
      }

      .layout-preview {
        display: grid;
        gap: 3px;
        width: 72px;
        height: 46px;
        padding: 5px;
        border: 1px solid #dce6e4;
        border-radius: 5px;
        background: #fafaf7;
      }

      .layout-preview i {
        display: block;
        border-top: 3px solid var(--teal);
        border-radius: 2px;
        background:
          repeating-linear-gradient(
            to bottom,
            #dfe7e5 0,
            #dfe7e5 1px,
            transparent 1px,
            transparent 5px
          );
      }

      .layout-copy strong {
        display: block;
        margin-bottom: 3px;
        font-size: 13px;
      }

      .layout-copy small {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.45;
      }

      .radio-dot {
        width: 18px;
        height: 18px;
        border: 1px solid #b8cbc7;
        border-radius: 50%;
        background: #fff;
      }

      .layout-option:has(input:checked) .radio-dot {
        border: 5px solid var(--teal);
      }

      .selected-sequence {
        max-height: 196px;
        margin: 0;
        padding: 0;
        overflow: auto;
        list-style: none;
      }

      .selected-sequence li {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        padding: 7px 0;
        color: var(--muted);
        font-size: 11px;
      }

      .selected-sequence b {
        display: grid;
        place-items: center;
        width: 21px;
        height: 21px;
        border-radius: 7px;
        background: var(--teal-soft);
        color: var(--teal-dark);
        font-size: 10px;
      }

      .selected-sequence span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .selected-sequence .sequence-empty {
        display: block;
        padding: 9px 0;
        color: #8a9899;
      }

      .export-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 20px;
        padding: 13px 14px;
        border-radius: 14px;
        background: #f2f7f4;
        color: var(--muted);
        font-size: 11px;
      }

      .export-summary strong {
        color: var(--teal-dark);
        font-size: 18px;
      }

      .export-button {
        width: 100%;
        margin-top: 11px;
        padding: 14px 18px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--teal), var(--teal-dark));
        box-shadow: 0 11px 24px rgba(21, 124, 120, 0.24);
        color: #fff;
        cursor: pointer;
        font-weight: 800;
        letter-spacing: 0.04em;
        transition:
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .export-button:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 14px 28px rgba(21, 124, 120, 0.3);
      }

      .export-button:disabled {
        box-shadow: none;
        cursor: not-allowed;
        opacity: 0.46;
      }

      .print-help {
        margin: 10px 2px 0;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.65;
        text-align: center;
      }

      .warning {
        margin-bottom: 16px;
        padding: 11px 14px;
        border: 1px solid #ead4a8;
        border-radius: 12px;
        background: #fff8e9;
        color: #80571f;
        font-size: 11px;
        line-height: 1.6;
      }

      .print-root {
        display: none;
      }

      @media (max-width: 980px) {
        .hero {
          grid-template-columns: 1fr;
        }

        .hero-stats {
          width: min(100%, 410px);
        }

        .workspace {
          grid-template-columns: 1fr;
        }

        .settings-panel {
          position: static;
        }
      }

      @media (max-width: 680px) {
        .screen-shell {
          width: min(100% - 22px, 1440px);
          padding-top: 16px;
        }

        .hero,
        .library-panel,
        .settings-panel {
          border-radius: 18px;
        }

        .hero {
          padding: 24px 20px;
        }

        .hero-stats {
          grid-template-columns: repeat(3, 1fr);
        }

        .stat {
          min-width: 0;
          padding: 11px;
        }

        .toolbar {
          grid-template-columns: 1fr;
        }

        .filters-and-actions {
          align-items: flex-start;
          flex-direction: column;
        }

        .card-list {
          grid-template-columns: 1fr;
        }
      }

      @media print {
        html,
        body {
          margin: 0 !important;
          background: #fff !important;
          color: #17282d !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        .screen-shell {
          display: none !important;
        }

        .print-root {
          display: block !important;
          background: #fff;
          font-family:
            "Microsoft YaHei",
            "Noto Sans CJK SC",
            Arial,
            sans-serif;
          font-size: 9pt;
          line-height: 1.58;
        }

        .print-header {
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          gap: 12mm;
          margin: 0 0 6mm;
          padding: 0 0 4mm;
          border-bottom: 0.45mm solid #167f80;
          break-after: avoid;
        }

        .print-header small {
          display: block;
          color: #167f80;
          font-size: 8pt;
          font-weight: 800;
          letter-spacing: 0.16em;
        }

        .print-header h1 {
          margin: 1mm 0 0;
          color: #16262c;
          font-family: inherit;
          font-size: 19pt;
          line-height: 1.2;
          letter-spacing: 0;
        }

        .print-header p {
          margin: 0 0 0.8mm;
          color: #68777b;
          font-size: 7.5pt;
          white-space: nowrap;
        }

        .print-columns {
          column-gap: 6mm;
          column-fill: auto;
          background: #fff;
        }

        .print-layout-double .print-columns,
        .print-layout-triple .print-columns {
          column-rule: 0.2mm solid #dce7e5;
        }

        .print-layout-triple .print-columns {
          column-fill: balance;
        }

        .print-card {
          width: 100%;
          margin: 0 0 5mm;
          padding: 4mm;
          border: 0.3mm solid #b9cfcc;
          border-top: 1.3mm solid #16888a;
          border-radius: 2.2mm;
          background: #fff;
          break-inside: avoid-column;
          page-break-inside: avoid;
          box-decoration-break: clone;
          -webkit-box-decoration-break: clone;
        }

        .print-card.problem {
          border-color: #ddc69c;
          border-top-color: #c58a2e;
        }

        .print-card > header {
          display: grid;
          grid-template-columns: 7mm minmax(0, 1fr);
          gap: 2.5mm;
          align-items: start;
          margin-bottom: 3mm;
          padding-bottom: 2.5mm;
          border-bottom: 0.2mm solid #dbe5e4;
          break-inside: avoid;
        }

        .print-number {
          display: grid;
          place-items: center;
          width: 7mm;
          height: 7mm;
          border-radius: 50%;
          background: #16888a;
          color: #fff;
          font-size: 7.5pt;
          font-weight: 800;
        }

        .problem .print-number {
          background: #c58a2e;
        }

        .print-card header small {
          display: block;
          margin-bottom: 0.6mm;
          color: #16888a;
          font-size: 6.8pt;
          font-weight: 800;
          letter-spacing: 0.08em;
        }

        .print-card.problem header small,
        .print-card.problem h3 {
          color: #8b5a16;
        }

        .print-card h2 {
          margin: 0;
          color: #17272d;
          font-size: 12.5pt;
          line-height: 1.35;
        }

        .print-section {
          padding: 2.4mm 0;
          border-bottom: 0.2mm solid #e3eae9;
          break-inside: avoid;
        }

        .print-section:last-child {
          padding-bottom: 0;
          border-bottom: 0;
        }

        .print-section h3 {
          margin: 0 0 1.2mm;
          color: #426167;
          font-size: 7.5pt;
          font-weight: 800;
          letter-spacing: 0.04em;
        }

        .print-section p,
        .print-section ul,
        .print-section ol {
          margin-top: 0;
          margin-bottom: 0;
        }

        .print-section ul,
        .print-section ol {
          padding-left: 4.5mm;
        }

        .print-section li + li {
          margin-top: 1.4mm;
        }

        .print-section li {
          break-inside: avoid;
        }

        .print-section h4 {
          margin: 1mm 0 0.5mm;
          font-size: inherit;
        }

        .print-card .lead,
        .print-card .connection {
          margin: 0 -1.5mm;
          padding: 2.4mm 1.5mm;
          border-radius: 1.5mm;
          background: #eef9f7;
        }

        .print-card .lead {
          margin-bottom: 0.8mm;
        }

        .print-card .connection {
          margin-top: 0.8mm;
          border-bottom: 0;
        }

        .print-card.problem .lead,
        .print-card.problem .connection {
          background: #fff7e7;
        }

        .print-card.problem .connection {
          background: #fff0cf;
        }

        .math-fallback {
          font-family: "Cambria Math", "STIX Two Math", serif;
        }

        .katex-display {
          margin: 1.5mm 0;
          overflow: visible;
          font-size: 0.92em;
          white-space: normal;
        }

        .print-layout-single .print-card {
          font-size: 10pt;
        }

        .print-layout-single .print-card h2 {
          font-size: 14pt;
        }

        .print-layout-triple .print-card {
          margin-bottom: 3mm;
          padding: 3mm;
          font-size: 7.7pt;
          line-height: 1.4;
        }

        .print-layout-triple .print-card > header {
          grid-template-columns: 6mm minmax(0, 1fr);
          gap: 2mm;
          margin-bottom: 2mm;
          padding-bottom: 1.8mm;
        }

        .print-layout-triple .print-number {
          width: 6mm;
          height: 6mm;
          font-size: 6.8pt;
        }

        .print-layout-triple .print-card header small {
          font-size: 6.2pt;
        }

        .print-layout-triple .print-card h2 {
          font-size: 10.8pt;
        }

        .print-layout-triple .print-section {
          padding: 1.6mm 0;
        }

        .print-layout-triple .print-section h3 {
          margin-bottom: 0.8mm;
          font-size: 6.8pt;
        }

        .print-layout-triple .print-section li + li {
          margin-top: 0.8mm;
        }
      }
    </style>
  </head>
  <body>
    <main class="screen-shell">
      <section class="hero">
        <div>
          <p class="eyebrow">GUIDED QA · CARD STUDIO</p>
          <h1>学习卡片导出工作台</h1>
          <p class="hero-copy">
            把真正需要复习的内容整理成一份清爽的 PDF。按点击顺序选卡片，再选择适合阅读或速览的版式。
          </p>
        </div>
        <div class="hero-stats" aria-label="卡片统计">
          <div class="stat"><strong id="total-stat">0</strong><span>全部卡片</span></div>
          <div class="stat"><strong id="knowledge-stat">0</strong><span>知识卡片</span></div>
          <div class="stat"><strong id="problem-stat">0</strong><span>题目卡片</span></div>
        </div>
      </section>

      <div id="warning-box" class="warning" hidden></div>

      <section class="workspace">
        <div class="panel library-panel">
          <div class="panel-heading">
            <div>
              <h2>选择要导出的卡片</h2>
              <p>列表按更新时间从新到旧排列；勾选数字就是 PDF 中的顺序。</p>
            </div>
            <span id="selection-count" class="selection-count">尚未选择</span>
          </div>

          <div class="toolbar">
            <label class="search">
              <span hidden>搜索卡片</span>
              <input id="search-input" type="search" placeholder="搜索标题或卡片内容…" />
            </label>
            <div class="batch-actions">
              <button id="select-visible" class="text-button" type="button">选择当前结果</button>
              <button id="clear-selected" class="text-button" type="button">清空选择</button>
            </div>
          </div>

          <div class="filters-and-actions">
            <div class="filter-row" role="group" aria-label="卡片类型">
              <button class="chip active" data-filter="all" type="button">全部</button>
              <button class="chip" data-filter="knowledge_card" type="button">知识卡片</button>
              <button class="chip" data-filter="problem_card" type="button">题目卡片</button>
            </div>
            <span id="visible-count" class="card-date"></span>
          </div>

          <div id="card-list" class="card-list"></div>
        </div>

        <aside class="panel settings-panel">
          <h2>PDF 版式</h2>
          <p>三种版式与原学习卡片导出功能一致，浏览器会在打印时自动切换纸张方向。</p>

          <div class="settings-group">
            <div class="settings-label">选择排版 <span>默认双列</span></div>
            <div class="layout-options">
              <label class="layout-option">
                <span class="layout-preview" style="grid-template-columns: 1fr"><i></i></span>
                <span class="layout-copy">
                  <strong>单列舒展</strong>
                  <small>A4 纵向 · 适合长推导</small>
                </span>
                <input type="radio" name="layout" value="single" />
                <span class="radio-dot" aria-hidden="true"></span>
              </label>
              <label class="layout-option">
                <span class="layout-preview" style="grid-template-columns: repeat(2, 1fr)"><i></i><i></i></span>
                <span class="layout-copy">
                  <strong>双列阅读</strong>
                  <small>A4 纵向 · 密度与可读性平衡</small>
                </span>
                <input type="radio" name="layout" value="double" checked />
                <span class="radio-dot" aria-hidden="true"></span>
              </label>
              <label class="layout-option">
                <span class="layout-preview" style="grid-template-columns: repeat(3, 1fr)"><i></i><i></i><i></i></span>
                <span class="layout-copy">
                  <strong>三列速览</strong>
                  <small>A4 横向 · 适合提纲复习</small>
                </span>
                <input type="radio" name="layout" value="triple" />
                <span class="radio-dot" aria-hidden="true"></span>
              </label>
            </div>
          </div>

          <div class="settings-group">
            <div class="settings-label">导出顺序 <span>可在卡片上调整</span></div>
            <ol id="selected-sequence" class="selected-sequence"></ol>
          </div>

          <div class="export-summary">
            <span>本次将导出</span>
            <span><strong id="export-count">0</strong> 张</span>
          </div>
          <button id="export-button" class="export-button" type="button" disabled>导出 PDF</button>
          <p class="print-help">点击后，在浏览器打印窗口中选择“另存为 PDF”。建议开启“背景图形”。</p>
        </aside>
      </section>
    </main>

    <section id="print-root" class="print-root print-layout-double" aria-label="学习卡片 PDF 打印区"></section>

    <script src="./cards-data.js"></script>
    <script>
      (() => {
        "use strict";

        const payload = window.CARD_EXPORT_DATA || { cards: [], warnings: [] };
        const cards = Array.isArray(payload.cards) ? payload.cards : [];
        const cardsById = new Map(cards.map((card) => [card.id, card]));
        const state = {
          filter: "all",
          query: "",
          layout: "double",
          selectedIds: [],
        };

        const cardList = document.querySelector("#card-list");
        const selectionCount = document.querySelector("#selection-count");
        const visibleCount = document.querySelector("#visible-count");
        const selectedSequence = document.querySelector("#selected-sequence");
        const exportCount = document.querySelector("#export-count");
        const exportButton = document.querySelector("#export-button");
        const printRoot = document.querySelector("#print-root");
        const pageSizeStyle = document.querySelector("#page-size-style");
        const originalTitle = document.title;

        const KNOWLEDGE_ORDER = [
          "知识点",
          "核心想法",
          "推导步骤",
          "什么时候使用",
          "常见错误",
          "与当前题目的连接",
        ];
        const PROBLEM_ORDER = ["题目摘要", "解法概览", "解题步骤", "易错点", "如何想到", "最终答案"];

        function escapeHtml(value) {
          return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function renderInline(value) {
          let html = escapeHtml(value);
          html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
          html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
          html = html.replace(
            /\$([^$\n]+)\$/g,
            '<span class="math-fallback">$$$1$$</span>',
          );
          return html;
        }

        function renderMarkdown(markdown) {
          const lines = String(markdown ?? "").replace(/\r\n/g, "\n").split("\n");
          const output = [];
          let paragraph = [];
          let listType = null;

          const flushParagraph = () => {
            if (paragraph.length) {
              output.push(`<p>${paragraph.map(renderInline).join("<br>")}</p>`);
              paragraph = [];
            }
          };
          const closeList = () => {
            if (listType) {
              output.push(`</${listType}>`);
              listType = null;
            }
          };

          for (let index = 0; index < lines.length; index += 1) {
            const line = lines[index];
            const trimmed = line.trim();

            if (!trimmed) {
              flushParagraph();
              closeList();
              continue;
            }

            if (trimmed.startsWith("$$")) {
              flushParagraph();
              closeList();
              let expression = trimmed.slice(2);
              while (!expression.endsWith("$$") && index + 1 < lines.length) {
                index += 1;
                expression += `\n${lines[index]}`;
              }
              expression = expression.replace(/\$\$$/, "");
              output.push(
                `<div class="math-fallback">$$${escapeHtml(expression.trim())}$$</div>`,
              );
              continue;
            }

            const subheading = trimmed.match(/^###\s+(.+)$/);
            if (subheading) {
              flushParagraph();
              closeList();
              output.push(`<h4>${renderInline(subheading[1])}</h4>`);
              continue;
            }

            const ordered = trimmed.match(/^\d+[.)]\s+(.+)$/);
            const unordered = trimmed.match(/^[-*]\s+(.+)$/);
            const item = ordered || unordered;
            if (item) {
              flushParagraph();
              const wantedList = ordered ? "ol" : "ul";
              if (listType !== wantedList) {
                closeList();
                listType = wantedList;
                output.push(`<${listType}>`);
              }
              output.push(`<li>${renderInline(item[1])}</li>`);
              continue;
            }

            if (/^\s{2,}[-*]\s+/.test(line) && listType) {
              const nestedText = trimmed.replace(/^[-*]\s+/, "");
              output.push(`<div>${renderInline(nestedText)}</div>`);
              continue;
            }

            closeList();
            paragraph.push(trimmed);
          }

          flushParagraph();
          closeList();
          return output.join("");
        }

        function formatDate(value) {
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return "时间未知";
          return new Intl.DateTimeFormat("zh-CN", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          }).format(date);
        }

        function cardTypeLabel(card) {
          return card.type === "knowledge_card" ? "知识卡片" : "题目卡片";
        }

        function previewText(card) {
          const section = card.sections?.find((item) => item.markdown) || card.sections?.[0];
          return String(section?.markdown || "卡片内容待补充")
            .replace(/[#*_`$>-]/g, " ")
            .replace(/\s+/g, " ")
            .trim();
        }

        function visibleCards() {
          const query = state.query.trim().toLocaleLowerCase("zh-CN");
          return cards.filter((card) => {
            if (state.filter !== "all" && card.type !== state.filter) return false;
            if (!query) return true;
            const searchable = [
              card.title,
              card.sourcePath,
              ...(card.sections || []).flatMap((section) => [section.label, section.markdown]),
            ]
              .join("\n")
              .toLocaleLowerCase("zh-CN");
            return searchable.includes(query);
          });
        }

        function moveSelected(id, direction) {
          const index = state.selectedIds.indexOf(id);
          const nextIndex = index + direction;
          if (index < 0 || nextIndex < 0 || nextIndex >= state.selectedIds.length) return;
          [state.selectedIds[index], state.selectedIds[nextIndex]] = [
            state.selectedIds[nextIndex],
            state.selectedIds[index],
          ];
          render();
        }

        function renderCardList() {
          const visible = visibleCards();
          visibleCount.textContent = `当前显示 ${visible.length} 张`;

          if (!cards.length) {
            cardList.innerHTML = `
              <div class="empty-state">
                <div class="empty-mark">卡</div>
                <h3>还没有学习卡片</h3>
                <p>完成一次知识点讲解或一道题后，Agent 会生成卡片并刷新这里。</p>
              </div>`;
            return;
          }

          if (!visible.length) {
            cardList.innerHTML = `
              <div class="empty-state">
                <div class="empty-mark">⌕</div>
                <h3>没有找到匹配的卡片</h3>
                <p>换一个关键词，或切回“全部”类型试试。</p>
              </div>`;
            return;
          }

          cardList.innerHTML = visible
            .map((card) => {
              const selectedIndex = state.selectedIds.indexOf(card.id);
              const selected = selectedIndex >= 0;
              const problem = card.type === "problem_card";
              return `
                <article class="selector-card${selected ? " selected" : ""}${problem ? " problem" : ""}">
                  <label class="selector-label">
                    <input type="checkbox" data-card-id="${escapeHtml(card.id)}" ${selected ? "checked" : ""}>
                    <span class="checkmark">${selected ? selectedIndex + 1 : ""}</span>
                    <span class="selector-main">
                      <span class="selector-meta">
                        <span class="type-badge"><i class="type-dot"></i>${cardTypeLabel(card)}</span>
                        <span class="card-date">${formatDate(card.updatedAt)}</span>
                      </span>
                      <strong class="selector-title">${escapeHtml(card.title)}</strong>
                      <span class="selector-preview">${escapeHtml(previewText(card))}</span>
                    </span>
                  </label>
                  ${
                    selected
                      ? `<div class="order-tools" aria-label="调整导出顺序">
                          <button class="order-button" data-move="-1" data-card-id="${escapeHtml(card.id)}" type="button" title="向前移动" ${selectedIndex === 0 ? "disabled" : ""}>↑</button>
                          <button class="order-button" data-move="1" data-card-id="${escapeHtml(card.id)}" type="button" title="向后移动" ${selectedIndex === state.selectedIds.length - 1 ? "disabled" : ""}>↓</button>
                        </div>`
                      : ""
                  }
                </article>`;
            })
            .join("");
        }

        function renderSelection() {
          const count = state.selectedIds.length;
          selectionCount.textContent = count ? `已选 ${count} / ${cards.length} 张` : "尚未选择";
          exportCount.textContent = String(count);
          exportButton.disabled = count === 0;

          if (!count) {
            selectedSequence.innerHTML = '<li class="sequence-empty">点击左侧卡片开始编排。</li>';
            return;
          }

          selectedSequence.innerHTML = state.selectedIds
            .map((id, index) => {
              const card = cardsById.get(id);
              return `<li><b>${index + 1}</b><span>${escapeHtml(card?.title || id)}</span></li>`;
            })
            .join("");
        }

        function render() {
          renderCardList();
          renderSelection();
        }

        function orderedSections(card) {
          const order = card.type === "knowledge_card" ? KNOWLEDGE_ORDER : PROBLEM_ORDER;
          return [...(card.sections || [])].sort((left, right) => {
            const leftIndex = order.indexOf(left.label);
            const rightIndex = order.indexOf(right.label);
            return (leftIndex < 0 ? 999 : leftIndex) - (rightIndex < 0 ? 999 : rightIndex);
          });
        }

        function sectionClass(card, label) {
          if (card.type === "knowledge_card") {
            if (label === "知识点") return " lead";
            if (label === "与当前题目的连接") return " connection";
          } else {
            if (label === "题目摘要") return " lead";
            if (label === "最终答案") return " connection";
          }
          return "";
        }

        function renderPrint() {
          const selectedCards = state.selectedIds
            .map((id) => cardsById.get(id))
            .filter(Boolean);
          const layoutMeta = {
            single: { label: "单列舒展", columns: 1, page: "A4 portrait" },
            double: { label: "双列阅读", columns: 2, page: "A4 portrait" },
            triple: { label: "三列速览", columns: 3, page: "A4 landscape" },
          }[state.layout];
          const exportedAt = new Intl.DateTimeFormat("zh-CN", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          }).format(new Date());

          printRoot.className = `print-root print-layout-${state.layout}`;
          pageSizeStyle.textContent = `@media print { @page { size: ${layoutMeta.page}; margin: 11mm; } }`;
          printRoot.innerHTML = `
            <header class="print-header">
              <div><small>学习卡片集</small><h1>我的数学学习卡片</h1></div>
              <p>${selectedCards.length} 张 · ${layoutMeta.label} · ${exportedAt}</p>
            </header>
            <div class="print-columns" style="column-count: ${layoutMeta.columns}">
              ${selectedCards
                .map(
                  (card, index) => `
                    <article class="print-card${card.type === "problem_card" ? " problem" : ""}">
                      <header>
                        <span class="print-number">${String(index + 1).padStart(2, "0")}</span>
                        <div><small>${cardTypeLabel(card)}</small><h2>${renderInline(card.title)}</h2></div>
                      </header>
                      ${orderedSections(card)
                        .map(
                          (section) => `
                            <section class="print-section${sectionClass(card, section.label)}">
                              <h3>${escapeHtml(section.label)}</h3>
                              ${section.markdown ? renderMarkdown(section.markdown) : '<p class="print-empty">本项暂无记录。</p>'}
                            </section>`,
                        )
                        .join("")}
                    </article>`,
                )
                .join("")}
            </div>`;
          typesetMath(printRoot);
        }

        function typesetMath(root = document.body) {
          if (typeof window.renderMathInElement !== "function") return;
          try {
            window.renderMathInElement(root, {
              delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false },
              ],
              throwOnError: false,
            });
          } catch {
            // Raw LaTeX remains readable when the optional typesetter is unavailable.
          }
        }

        cardList.addEventListener("change", (event) => {
          const input = event.target.closest("input[data-card-id]");
          if (!input) return;
          const id = input.dataset.cardId;
          const selectedIndex = state.selectedIds.indexOf(id);
          if (input.checked && selectedIndex < 0) {
            state.selectedIds.push(id);
          } else if (!input.checked && selectedIndex >= 0) {
            state.selectedIds.splice(selectedIndex, 1);
          }
          render();
        });

        cardList.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-move]");
          if (!button) return;
          moveSelected(button.dataset.cardId, Number(button.dataset.move));
        });

        document.querySelector("#search-input").addEventListener("input", (event) => {
          state.query = event.target.value;
          renderCardList();
        });

        document.querySelectorAll("[data-filter]").forEach((button) => {
          button.addEventListener("click", () => {
            state.filter = button.dataset.filter;
            document.querySelectorAll("[data-filter]").forEach((item) => {
              item.classList.toggle("active", item === button);
            });
            renderCardList();
          });
        });

        document.querySelector("#select-visible").addEventListener("click", () => {
          for (const card of visibleCards()) {
            if (!state.selectedIds.includes(card.id)) state.selectedIds.push(card.id);
          }
          render();
        });

        document.querySelector("#clear-selected").addEventListener("click", () => {
          state.selectedIds = [];
          render();
        });

        document.querySelectorAll('input[name="layout"]').forEach((input) => {
          input.addEventListener("change", () => {
            state.layout = input.value;
          });
        });

        exportButton.addEventListener("click", () => {
          if (!state.selectedIds.length) return;
          renderPrint();
          const date = new Date().toISOString().slice(0, 10);
          document.title = `学习卡片-${date}`;
          requestAnimationFrame(() => window.print());
        });

        window.addEventListener("afterprint", () => {
          document.title = originalTitle;
        });

        window.addEventListener("load", () => typesetMath(document.body));

        document.querySelector("#total-stat").textContent = String(cards.length);
        document.querySelector("#knowledge-stat").textContent = String(
          cards.filter((card) => card.type === "knowledge_card").length,
        );
        document.querySelector("#problem-stat").textContent = String(
          cards.filter((card) => card.type === "problem_card").length,
        );

        const warnings = Array.isArray(payload.warnings) ? payload.warnings : [];
        if (warnings.length) {
          const warningBox = document.querySelector("#warning-box");
          warningBox.hidden = false;
          warningBox.textContent = `有 ${warnings.length} 个文件未能读取，其他卡片仍可正常导出。`;
        }

        render();
      })();
    </script>
  </body>
</html>
